<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 400" preserveAspectRatio="xMidYMid slice">
  <g fill="#fff">
    <circle cx="30" cy="40" r="1.2"><animate attributeName="opacity" values=".2;1;.2" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="70" r="1.6"><animate attributeName="opacity" values="1;.2;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="20" r="1"><animate attributeName="opacity" values=".3;1;.3" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="150" r="1.4"><animate attributeName="opacity" values="1;.3;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="200" r="1.1"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="20" cy="260" r="1.5"><animate attributeName="opacity" values="1;.2;1" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="330" r="1.2"><animate attributeName="opacity" values=".3;1;.3" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="370" r="1.6"><animate attributeName="opacity" values="1;.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="300" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="340" r="1.1"><animate attributeName="opacity" values=".4;1;.4" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>
  <g stroke="#fff" stroke-linecap="round">
    <line x1="0" y1="0" x2="-40" y2="16" stroke-width="1.4">
      <animateTransform attributeName="transform" type="translate" values="360 30;120 126;120 126" keyTimes="0;.25;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.05;.25;1" dur="6s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
